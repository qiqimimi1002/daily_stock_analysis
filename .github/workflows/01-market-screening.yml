name: 全市场初筛

on:
  schedule:
    # 工作日北京时间 09:40 正常触发，09:55/10:10 作为调度延迟兜底。
    # 执行守卫按北京时间日期保证同一天只生产一次有效初筛结果。
    - cron: "40 1 * * 1-5"
    - cron: "55 1 * * 1-5"
    - cron: "10 2 * * 1-5"
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "触发来源（外部调度器使用专用值）"
        required: true
        default: "workflow_dispatch_manual"
        type: choice
        options:
          - "workflow_dispatch_manual"
          - "external_scheduler_cloudflare"
      top_n:
        description: "初筛候选数量"
        required: true
        default: "5"
        type: choice
        options:
          - "5"
          - "10"
      run_deep_analysis:
        description: "继续对前三只候选运行 Daily Stock 深度分析"
        required: true
        default: true
        type: boolean
      force_run:
        description: "强制运行深度分析（跳过交易日检查）"
        required: false
        default: false
        type: boolean

concurrency:
  group: market-screening
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 创建输出目录
        run: mkdir -p data reports logs

      - name: 检查当天是否需要执行初筛
        id: execution_guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 scripts/screening_run_guard.py check \
            --repository "${{ github.repository }}" \
            --workflow-file "01-market-screening.yml" \
            --workflow-name "全市场初筛" \
            --branch "${{ github.ref_name }}" \
            --run-id "${{ github.run_id }}" \
            --run-number "${{ github.run_number }}" \
            --event-name "${{ github.event_name }}" \
            --event-schedule "${{ github.event.schedule || '' }}" \
            --dispatch-source "${{ inputs.trigger_source || 'workflow_dispatch_manual' }}" \
            --output data/screening_execution_guard.json \
            --log logs/screening_execution_guard.log \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: 设置 Python 环境
        if: steps.execution_guard.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        if: steps.execution_guard.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 记录实际初筛开始时间
        if: steps.execution_guard.outputs.should_run == 'true'
        shell: bash
        run: |
          SCREENING_STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "SCREENING_RUN_STARTED_AT=$SCREENING_STARTED_AT" >> "$GITHUB_ENV"
          python scripts/screening_run_guard.py mark-started \
            --context data/screening_execution_guard.json \
            --started-at "$SCREENING_STARTED_AT" \
            --log logs/screening_execution_guard.log

      - name: 执行沪深主板全市场初筛
        id: screening
        if: steps.execution_guard.outputs.should_run == 'true'
        env:
          SCREEN_TOP_N: ${{ inputs.top_n || vars.SCREEN_TOP_N || '5' }}
          SCREEN_ANALYSIS_LIMIT: ${{ vars.SCREEN_ANALYSIS_LIMIT || '3' }}
          SCREEN_PRESELECT_LIMIT: ${{ vars.SCREEN_PRESELECT_LIMIT || '60' }}
          SCREEN_ENRICHMENT_LIMIT: ${{ vars.SCREEN_ENRICHMENT_LIMIT || '8' }}
          SCREEN_EVIDENCE_WORKERS: ${{ vars.SCREEN_EVIDENCE_WORKERS || '2' }}
          SCREEN_EVIDENCE_BUDGET_SECONDS: ${{ vars.SCREEN_EVIDENCE_BUDGET_SECONDS || '12' }}
          SCREEN_MIN_AMOUNT_YUAN: ${{ vars.SCREEN_MIN_AMOUNT_YUAN || '200000000' }}
        run: |
          python scripts/run_market_screener.py \
            --top-n "$SCREEN_TOP_N" \
            --analysis-limit "$SCREEN_ANALYSIS_LIMIT" \
            --preselect-limit "$SCREEN_PRESELECT_LIMIT" \
            --history-workers 4 \
            --enrichment-limit "$SCREEN_ENRICHMENT_LIMIT" \
            --evidence-workers "$SCREEN_EVIDENCE_WORKERS" \
            --evidence-budget-seconds "$SCREEN_EVIDENCE_BUDGET_SECONDS" \
            --min-amount-yuan "$SCREEN_MIN_AMOUNT_YUAN"

      - name: 读取候选代码
        id: selected
        if: >-
          steps.execution_guard.outputs.should_run == 'true' &&
          steps.screening.outcome == 'success'
        shell: bash
        run: |
          CODES="$(tr -d '\r\n ' < data/screened_codes.txt)"
          echo "codes=$CODES" >> "$GITHUB_OUTPUT"
          echo "深度分析候选: ${CODES:-无}"

      - name: 对候选运行 Daily Stock 深度分析
        id: deep_analysis
        if: >-
          steps.execution_guard.outputs.should_run == 'true' &&
          steps.selected.outputs.codes != '' &&
          (github.event_name == 'schedule' || inputs.run_deep_analysis)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL || 'gemini-3-flash-preview' }}
          GEMINI_MAX_RETRIES: ${{ vars.GEMINI_MAX_RETRIES || '2' }}
          GEMINI_RETRY_DELAY: ${{ vars.GEMINI_RETRY_DELAY || '5' }}
          GEMINI_RETRY_MAX_DELAY: ${{ vars.GEMINI_RETRY_MAX_DELAY || '20' }}
          LLM_RETRY_EVENTS_PATH: logs/llm_retry_events.jsonl
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
          REPORT_TYPE: ${{ vars.REPORT_TYPE || secrets.REPORT_TYPE || 'simple' }}
          REPORT_LANGUAGE: ${{ vars.REPORT_LANGUAGE || secrets.REPORT_LANGUAGE || 'zh' }}
          MARKET_REVIEW_ENABLED: "false"
          LOG_LEVEL: INFO
          MAX_WORKERS: "1"
          ENABLE_CHIP_DISTRIBUTION: "false"
          REALTIME_SOURCE_PRIORITY: ${{ vars.REALTIME_SOURCE_PRIORITY || 'tencent,akshare_sina,efinance,akshare_em' }}
        shell: bash
        run: |
          FORCE_ARG=""
          if [ "${{ inputs.force_run }}" = "true" ]; then
            FORCE_ARG="--force-run"
          fi
          python main.py \
            --stocks "${{ steps.selected.outputs.codes }}" \
            --no-market-review \
            $FORCE_ARG

      - name: 生成并校验运行清单
        if: ${{ always() && steps.execution_guard.outputs.should_run == 'true' }}
        env:
          SCREENING_OUTCOME: ${{ steps.screening.outcome || 'skipped' }}
          DEEP_ANALYSIS_OUTCOME: ${{ steps.deep_analysis.outcome || 'skipped' }}
          DEEP_ANALYSIS_REQUESTED: ${{ github.event_name == 'schedule' || inputs.run_deep_analysis }}
        shell: bash
        run: |
          python scripts/build_screening_run_manifest.py \
            --run-id "${{ github.run_id }}" \
            --run-number "${{ github.run_number }}" \
            --branch "${{ github.ref_name }}" \
            --artifact-name "market-screening-${{ github.run_number }}" \
            --screening-outcome "$SCREENING_OUTCOME" \
            --deep-analysis-outcome "$DEEP_ANALYSIS_OUTCOME" \
            --deep-analysis-requested "$DEEP_ANALYSIS_REQUESTED" \
            --started-at "$SCREENING_RUN_STARTED_AT" \
            --completed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --execution-context data/screening_execution_guard.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --strict

      - name: 发布固定结果入口
        if: >-
          always() &&
          steps.execution_guard.outputs.should_run == 'true' &&
          hashFiles('data/screening_run_manifest.json') != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TRADE_DATE="$(python -c 'import json; print(json.load(open("data/screening_run_manifest.json", encoding="utf-8"))["trade_date"])')"
          PAYLOAD_DIR="$RUNNER_TEMP/screening-payload"
          PUBLISH_DIR="$RUNNER_TEMP/screening-results"
          rm -rf "$PAYLOAD_DIR" "$PUBLISH_DIR"
          mkdir -p "$PAYLOAD_DIR/latest/reports" "$PAYLOAD_DIR/history/$TRADE_DATE/reports"

          cp data/screening_run_manifest.json "$PAYLOAD_DIR/latest/manifest.json"
          if compgen -G 'data/market_screening_*.json' > /dev/null; then
            cp "$(ls -1 data/market_screening_*.json | tail -n 1)" "$PAYLOAD_DIR/latest/market_screening.json"
          fi
          if [ -f data/screened_codes.txt ]; then
            cp data/screened_codes.txt "$PAYLOAD_DIR/latest/screened_codes.txt"
          fi
          if compgen -G 'reports/*.md' > /dev/null; then
            cp reports/*.md "$PAYLOAD_DIR/latest/reports/"
          fi
          cp -a "$PAYLOAD_DIR/latest/." "$PAYLOAD_DIR/history/$TRADE_DATE/"

          if git fetch origin screening-results; then
            git worktree add -B screening-results "$PUBLISH_DIR" origin/screening-results
          else
            git worktree add --detach "$PUBLISH_DIR" "$GITHUB_SHA"
            cd "$PUBLISH_DIR"
            git switch --orphan screening-results
            git rm -rf . || true
          fi

          cd "$PUBLISH_DIR"
          rm -rf latest "history/$TRADE_DATE"
          mkdir -p history
          cp -a "$PAYLOAD_DIR/latest" latest
          mkdir -p "history/$TRADE_DATE"
          cp -a "$PAYLOAD_DIR/history/$TRADE_DATE/." "history/$TRADE_DATE/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest "history/$TRADE_DATE"
          if git diff --cached --quiet; then
            echo "固定结果入口没有变化，无需提交。"
            exit 0
          fi
          git commit -m "publish screening results for $TRADE_DATE (run ${{ github.run_number }})"
          git push origin HEAD:screening-results

      - name: 上传初筛及深度分析结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: market-screening-${{ github.run_number }}
          path: |
            data/market_screening_*.json
            data/screened_codes.txt
            data/screening_execution_guard.json
            data/screening_run_manifest.json
            reports/*.md
            logs/*.log
            logs/*.jsonl
          if-no-files-found: warn
          retention-days: 30
