name = "daily-stock-screening-scheduler"
main = "src/index.js"
compatibility_date = "2026-08-11"
workers_dev = false

[vars]
GITHUB_OWNER = "qiqimimi1002"
GITHUB_REPO = "daily_stock_analysis"
GITHUB_WORKFLOW = "01-market-screening.yml"
GITHUB_REF = "main"

[triggers]
# Cloudflare cron uses UTC. 02:00/02:05 UTC are 10:00/10:05 Asia/Shanghai.
crons = [ "0 2 * * MON-FRI", "5 2 * * MON-FRI" ]

[observability]
enabled = true
head_sampling_rate = 1
